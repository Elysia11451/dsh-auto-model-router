- insert:
    - id: auto-model-router
      name: 'dsh-auto-model-router'
      config:
        enabled: true
        priorityMode: manual
        workMode: auto
        manualWorkModel: ""
        workModelPriority:
          - mimo-v2.6-flash-free
          - glm-5.3-flash
          - deepseek-v4.1-flash
        workModelFallback: mimo-v2.6-flash-free
        enableDynamicRanking: true
        rankingRefreshSeconds: 3600
        chatMode: auto
        manualChatModel: ""
        chatModelPriority: []
        enableGroupHint: false
        hintCooldownMs: 300000
        switchCooldownMs: 5000
        reclaimUnknownModel: true
        firstTurnPrompt: true
        firstTurnPromptTimeoutMs: 60000
